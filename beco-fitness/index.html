<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Oficial — Beco Fitness Esporte Clube</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-gold: #D4AF37;
            --primary-gold-hover: #e5be3b;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: 1px; color: var(--text-main); }
        .logo-container span { color: var(--primary-gold); }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary-gold); }

        .hero {
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)), #1a1a1a center/cover no-repeat;
            padding: 5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h2 { font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; color: var(--text-main); }
        .hero h2 span { color: var(--primary-gold); }
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 2rem auto; }

        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
        .section-title { font-size: 1.8rem; margin-bottom: 2rem; border-left: 4px solid var(--primary-gold); padding-left: 12px; font-weight: 700; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover { transform: translateY(-5px); border-color: var(--primary-gold); }

        .product-img {
            background-color: #262626;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 0 1rem;
        }

        .product-info { padding: 1.5rem; flex-grow: 1; }
        .product-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
        .product-meta { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            background-color: #161616;
        }

        .product-price { font-size: 1.25rem; font-weight: 900; color: var(--text-main); }

        .btn-buy {
            background-color: var(--primary-gold);
            color: #121212;
            border: none;
            padding: 8px 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-buy:hover { background-color: var(--primary-gold-hover); }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        .modal-content h3 { margin-bottom: 1rem; color: var(--primary-gold); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #121212; border: 1px solid var(--border-color); color: #fff; border-radius: 4px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }
        .btn-cancel { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

        footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; margin-top: 4rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>BECO FITNESS <span>ESPORTE CLUBE</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="#produtos">Catálogo</a></li>
            <li><a href="#" onclick="renderizarGrid(); return false;">Atualizar Loja</a></li>
        </ul>
    </header>

    <section class="hero">
        <h2>Vestindo a Paixão pelo <span>Esporte e Performance</span></h2>
        <p>Sistema integrado de compras, estoque e vendas do clube.</p>
    </section>

    <main class="container" id="produtos">
        <h3 class="section-title">Estoque Disponível</h3>
        <div class="product-grid" id="product-grid"></div>
    </main>

    <!-- Modal de Venda -->
    <div class="modal" id="modal-pedido">
        <div class="modal-content">
            <h3 id="modal-produto-nome">Finalizar Compra</h3>
            <form id="form-pedido" onsubmit="enviarPedido(event)">
                <input type="hidden" id="modal-sku">
                <input type="hidden" id="modal-preco">
                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" id="cliente-nome" required placeholder="Ex: Carlos Silva">
                </div>
                <div class="form-group">
                    <label>Tamanho</label>
                    <input type="text" id="modal-tamanho" readonly style="background: #222;">
                </div>
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="modal-qtd" value="1" min="1" max="10" required>
                </div>
                <div class="form-group">
                    <label>Pagamento</label>
                    <select id="modal-pagamento">
                        <option value="Pix">Pix</option>
                        <option value="Cartão">Cartão</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-buy" id="btn-finalizar">Confirmar Pedido</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Beco Fitness Esporte Clube. Desenvolvido para Portfólio Profissional (devyra.com.br).</p>
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlR89U65g2-SRE36kauZGyS0gNBevG8DY1qTdu4d8exl8hh5OISq3GZr_mH73gXbbS/exec";
        
        const produtosCache = [
            { sku: "CAM-Jogador", produto: "Camisa Jogador Oficial", tamanho: "P", preco: 140.00, saldo: 50, status: "Aprovado" },
            { sku: "CAM-Torcedor", produto: "Camisa Torcedor Oficial", tamanho: "G", preco: 70.00, saldo: 60, status: "Aprovado" }
        ];

        function renderizarGrid() {
            const grid = document.getElementById("product-grid");
            if (!grid) return;
            grid.innerHTML = "";

            produtosCache.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "product-card";
                const isEsgotado = item.status === "Esgotado" || Number(item.saldo) <= 0;

                card.innerHTML = `
                    <div class="product-img">${item.produto}<br><small style="color:var(--text-muted)">Tam: ${item.tamanho}</small></div>
                    <div class="product-info">
                        <div class="product-meta">SKU: ${item.sku}</div>
                        <h4 class="product-title">${item.produto}</h4>
                        <div class="product-meta">Estoque: <span style="color: ${isEsgotado ? '#ff6b6b' : '#51cf66'}">${item.saldo} un.</span></div>
                    </div>
                    <div class="product-footer">
                        <span class="product-price">R$ ${Number(item.preco).toFixed(2).replace('.', ',')}</span>
                        <button class="btn-buy" ${isEsgotado ? 'disabled style="background:#444; color:#777; cursor:not-allowed;"' : `onclick="abrirModal(${index})"`}>
                            ${isEsgotado ? 'Esgotado' : 'Comprar'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirModal(index) {
            const item = produtosCache[index];
            document.getElementById("modal-sku").value = item.sku;
            document.getElementById("modal-produto-nome").innerText = item.produto;
            document.getElementById("modal-tamanho").value = item.tamanho;
            document.getElementById("modal-preco").value = item.preco;
            document.getElementById("modal-pedido").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modal-pedido").style.display = "none";
        }

        async function enviarPedido(event) {
            event.preventDefault();
            const btn = document.getElementById("btn-finalizar");
            btn.innerText = "Registrando...";
            btn.disabled = true;

            const payload = {
                cliente: document.getElementById("cliente-nome").value,
                produto: document.getElementById("modal-produto-nome").innerText,
                tamanho: document.getElementById("modal-tamanho").value,
                quantidade: document.getElementById("modal-qtd").value,
                valorUnitario: document.getElementById("modal-preco").value,
                pagamento: document.getElementById("modal-pagamento").value
            };

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.log("Envio processado");
            }

            alert("Pedido realizado com sucesso! Venda registada no sistema.");
            fecharModal();
            document.getElementById("form-pedido").reset();
            btn.innerText = "Confirmar Pedido";
            btn.disabled = false;
        }

        window.addEventListener("DOMContentLoaded", renderizarGrid);
    </script>
</body>
</html>
